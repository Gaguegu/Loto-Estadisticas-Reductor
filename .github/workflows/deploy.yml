name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: './Loto Estadisticas Reductor' # ⬅️ Corrección de subcarpeta
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './Loto Estadisticas Reductor/bun.lock' # ⬅️ Ruta del candado

      - name: Install dependencies
        run: bun install || npm install

      - name: Build project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './Loto Estadisticas Reductor/dist' # ⬅️ Ruta de la compilación

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
